<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media Select Pro V7</title>
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--panel:#181818;--panel2:#222;--line:#353535;--text:#f1f1f1;--muted:#aaa;--red:#ff0033;--blue:#3ea6ff;--green:#2ba640;--radius:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:64px;padding:0 24px;background:rgba(15,15,15,.96);border-bottom:1px solid #242424;backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;white-space:nowrap}.play{display:grid;place-items:center;width:34px;height:24px;border-radius:7px;background:var(--red);font-size:13px}.version{color:var(--muted);font-size:11px;font-weight:400;align-self:flex-start;margin-top:14px}
.server{margin-left:auto;display:flex;align-items:center;gap:7px;color:#b7ddb9;font-size:12px}.server i{width:8px;height:8px;border-radius:50%;background:#35c759;box-shadow:0 0 10px #35c759}
main{max-width:1380px;margin:auto;padding:26px 28px 70px}
.search-panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;max-width:1040px;margin:0 auto 24px}
.url-wrap{position:relative}.url-wrap textarea{width:100%;min-height:52px;max-height:130px;resize:vertical;padding:14px 46px 12px 16px;border:1px solid #555;border-radius:26px;background:#121212;color:#fff;outline:0}.url-wrap textarea:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.analyze{height:52px;padding:0 24px;border:0;border-radius:26px;background:#f1f1f1;color:#111;font-weight:700}.analyze:hover{background:#d9d9d9}.analyze:disabled{opacity:.55;cursor:wait}
.hint{grid-column:1/-1;color:var(--muted);font-size:12px;padding-left:16px;margin-top:-4px}
.notice{display:none;max-width:1040px;margin:0 auto 20px;padding:12px 15px;border:1px solid #735c22;border-radius:10px;background:#2c2513;color:#f0d58d}.notice.show{display:block}.notice.error{border-color:#813641;background:#32191d;color:#ffb5be}
.playlist-head{display:none;align-items:flex-end;gap:16px;margin:18px 0}.playlist-head.show{display:flex}.playlist-head h1{margin:0;font-size:24px}.playlist-head p{margin:3px 0 0;color:var(--muted)}.selection-count{margin-left:auto;color:var(--muted);white-space:nowrap}
.toolbar{display:none;align-items:center;gap:9px;margin-bottom:18px;flex-wrap:wrap}.toolbar.show{display:flex}.small-btn{padding:8px 14px;border:1px solid var(--line);border-radius:18px;background:var(--panel2);color:var(--text)}.small-btn:hover{background:#333}.toolbar .spacer{flex:1}.next-btn{color:var(--blue)}
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:25px 16px}
.video-card{position:relative;min-width:0;border-radius:var(--radius);transition:background .15s,box-shadow .15s}.video-card:hover{background:#181818;box-shadow:0 0 0 8px #181818}.video-card.selected .thumb{box-shadow:0 0 0 3px var(--blue)}.video-card.disabled{opacity:.55}
.card-check{position:absolute;z-index:3;top:10px;left:10px;width:24px;height:24px;margin:0;accent-color:var(--blue);filter:drop-shadow(0 1px 3px #000)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#272727,#1a1a1a);transition:box-shadow .15s}.thumb img{display:block;width:100%;height:100%;object-fit:cover}.thumb-fallback{display:grid;place-items:center;width:100%;height:100%;color:#777;font-size:36px}.duration{position:absolute;right:6px;bottom:6px;padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.82);font-size:12px;font-weight:700}.badge{position:absolute;left:8px;bottom:8px;padding:3px 7px;border-radius:4px;background:rgba(0,0,0,.82);font-size:11px}
.video-info{padding:11px 4px 0}.video-title{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;margin:0 0 6px;font-size:14px;line-height:1.35;font-weight:700}.video-meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{display:none;place-items:center;min-height:260px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center}.empty.show{display:grid}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:5px}
.download-panel{display:none;grid-template-columns:repeat(4,minmax(130px,1fr)) auto;gap:12px;align-items:end;margin-top:34px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.download-panel.show{display:grid}.field{display:flex;flex-direction:column;gap:6px}.field label{color:var(--muted);font-size:12px}.field input,.field select{height:42px;padding:0 11px;border:1px solid #494949;border-radius:9px;background:#101010;color:#fff;outline:0}.folder-row{display:flex}.folder-row input{min-width:0;flex:1;border-radius:9px 0 0 9px}.folder-row button{width:42px;border:1px solid #494949;border-left:0;border-radius:0 9px 9px 0;background:#292929;color:#fff}
.download{height:42px;padding:0 22px;border:0;border-radius:21px;background:var(--blue);color:#07131c;font-weight:700}.download:disabled{opacity:.45;cursor:not-allowed}.cancel{height:42px;padding:0 18px;border:1px solid #7d333b;border-radius:21px;background:#32191d;color:#ffb5be}
.progress-panel{display:none;margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.progress-panel.show{display:block}.progress-head{display:flex;gap:10px;align-items:center}.progress-head strong{flex:1}.progress-head span{color:var(--blue);font-weight:700}.bar{height:5px;margin:12px 0;border-radius:9px;background:#303030;overflow:hidden}.bar i{display:block;width:0;height:100%;background:var(--blue);transition:width .25s}.logs{max-height:230px;overflow:auto;margin:12px 0 0;padding:12px;border-radius:9px;background:#090909;color:#c7c7c7;font:12px/1.5 Consolas,monospace;white-space:pre-wrap}
@media(max-width:900px){.download-panel{grid-template-columns:1fr 1fr}.download,.cancel{width:100%}}
@media(max-width:640px){.topbar{padding:0 14px}.server span{display:none}main{padding:18px 14px 60px}.search-panel{grid-template-columns:1fr}.analyze{width:100%}.videos{grid-template-columns:1fr 1fr;gap:22px 10px}.playlist-head{align-items:flex-start}.selection-count{margin-left:0}.download-panel{grid-template-columns:1fr}.video-title{font-size:13px}}
@media(max-width:420px){.videos{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><span class="play">▶</span> Media Select Pro <span class="version">V7</span></div>
  <div class="server"><i></i><span>Application locale</span></div>
</header>
<main>
  <section class="search-panel">
    <div class="url-wrap"><textarea id="sourceUrl" rows="1" placeholder="Colle une URL YouTube, une playlist, une chaîne ou plusieurs liens…"></textarea></div>
    <button class="analyze" id="analyzeBtn">Afficher les vidéos</button>
    <div class="hint">Une playlist ou une chaîne affiche ses vidéos ci-dessous. Tu choisis ensuite celles à télécharger.</div>
  </section>

  <div class="notice" id="notice" role="alert"></div>

  <section class="playlist-head" id="playlistHead">
    <div><h1 id="playlistTitle">Vidéos</h1><p id="playlistMeta"></p></div>
    <div class="selection-count" id="selectionCount">0 sélectionnée</div>
  </section>
  <div class="toolbar" id="toolbar">
    <button class="small-btn" id="selectAll">Tout sélectionner</button>
    <button class="small-btn" id="selectNone">Tout désélectionner</button>
    <span class="spacer"></span>
    <button class="small-btn next-btn" id="nextPage" hidden>Page suivante</button>
  </div>

  <section class="videos" id="videos" aria-live="polite"></section>
  <section class="empty show" id="empty"><div><strong>Ta sélection apparaîtra ici</strong>Colle une URL puis clique sur « Afficher les vidéos ».</div></section>

  <section class="download-panel" id="downloadPanel">
    <div class="field"><label for="mediaMode">Format</label><select id="mediaMode"><option value="video_mp4">Vidéo MP4</option><option value="video_best">Vidéo qualité maximale</option><option value="audio_mp3">Audio MP3</option><option value="audio_m4a">Audio M4A</option><option value="audio_original">Audio original</option></select></div>
    <div class="field"><label for="quality">Qualité vidéo</label><select id="quality"><option value="best">Meilleure disponible</option><option value="2160">2160p</option><option value="1440">1440p</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option><option value="360">360p</option></select></div>
    <div class="field"><label for="folder">Dossier de destination</label><div class="folder-row"><input id="folder" readonly placeholder="Choisir un dossier"><button id="folderBtn" title="Choisir un dossier">…</button></div></div>
    <div class="field"><label><input type="checkbox" id="excludeShorts" checked> Exclure les Shorts des chaînes</label></div>
    <button class="download" id="downloadBtn" disabled>Télécharger</button>
  </section>

  <section class="progress-panel" id="progressPanel">
    <div class="progress-head"><strong id="statusText">Prêt</strong><span id="progressText"></span><button class="cancel" id="cancelBtn">Arrêter</button></div>
    <div class="bar"><i id="progressBar"></i></div>
    <pre class="logs" id="logs">Le journal du téléchargement apparaîtra ici.</pre>
  </section>
</main>
<script>
const TOKEN='__LOCAL_TOKEN__';
const state={entries:[],selected:new Set(),effectiveUrl:'',nextPage:'',running:false};
const $=id=>document.getElementById(id);
const sourceUrl=$('sourceUrl'),analyzeBtn=$('analyzeBtn'),videos=$('videos'),empty=$('empty'),notice=$('notice');

async function api(path,data){
  const response=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':TOKEN},body:JSON.stringify(data||{})});
  const result=await response.json();
  if(!response.ok) throw new Error(result.error||'Une erreur est survenue.');
  return result;
}
function escapeHtml(value){return String(value||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function formatDuration(seconds){if(seconds==null)return'';const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;}
function showNotice(message,isError=false){notice.textContent=message||'';notice.className='notice'+(message?' show':'')+(isError?' error':'');}
function updateSelection(){
  document.querySelectorAll('.video-card').forEach(card=>card.classList.toggle('selected',state.selected.has(Number(card.dataset.index))));
  const n=state.selected.size,total=state.entries.filter(e=>!e.nested).length;
  $('selectionCount').textContent=`${n} sélectionnée${n>1?'s':''} sur ${total}`;
  $('downloadBtn').disabled=!n||!$('folder').value||state.running;
}
function renderEntries(){
  videos.innerHTML='';
  state.entries.forEach(entry=>{
    const card=document.createElement('article');card.className='video-card'+(entry.nested?' disabled':'');card.dataset.index=entry.index;
    const image=entry.thumbnail?`<img src="${escapeHtml(entry.thumbnail)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML='<span class=&quot;thumb-fallback&quot;>▶</span>'">`:'<span class="thumb-fallback">▶</span>';
    card.innerHTML=`<input class="card-check" type="checkbox" aria-label="Sélectionner ${escapeHtml(entry.title)}" ${state.selected.has(entry.index)?'checked':''} ${entry.nested?'disabled':''}><div class="thumb">${image}${entry.duration!=null?`<span class="duration">${formatDuration(entry.duration)}</span>`:''}${entry.short?'<span class="badge">SHORT</span>':''}</div><div class="video-info"><h2 class="video-title">${escapeHtml(entry.title)}</h2><div class="video-meta">${escapeHtml(entry.channel||entry.site||'Vidéo')} ${entry.nested?' · Playlist imbriquée':''}</div></div>`;
    if(!entry.nested){card.addEventListener('click',event=>{if(event.target.tagName!=='INPUT')card.querySelector('input').checked=!card.querySelector('input').checked;const checked=card.querySelector('input').checked;checked?state.selected.add(entry.index):state.selected.delete(entry.index);updateSelection();});card.querySelector('input').addEventListener('change',event=>{event.target.checked?state.selected.add(entry.index):state.selected.delete(entry.index);updateSelection();});}
    videos.appendChild(card);
  });
  empty.classList.toggle('show',!state.entries.length);$('playlistHead').classList.toggle('show',!!state.entries.length);$('toolbar').classList.toggle('show',!!state.entries.length);$('downloadPanel').classList.toggle('show',!!state.entries.length);updateSelection();
}
async function analyze(urlOverride){
  const url=(urlOverride||sourceUrl.value).trim();if(!url){showNotice('Colle d’abord une URL.',true);return;}
  analyzeBtn.disabled=true;analyzeBtn.textContent='Analyse en cours…';showNotice('');empty.classList.add('show');empty.innerHTML='<div><strong>Analyse de la liste…</strong>Les titres et miniatures vont apparaître ici.</div>';videos.innerHTML='';
  try{
    const result=await api('preview',{url,exclude_shorts:$('excludeShorts').checked});
    sourceUrl.value=result.effective_url||url;state.effectiveUrl=result.effective_url||url;state.entries=result.entries||[];state.selected=new Set(state.entries.filter(e=>!e.nested).slice(0,5).map(e=>e.index));state.nextPage=result.next_page||'';
    $('playlistTitle').textContent=result.title||'Vidéos';$('playlistMeta').textContent=[result.site,`${state.entries.length} élément${state.entries.length>1?'s':''}`,result.truncated?`aperçu limité à ${result.preview_limit}`:''].filter(Boolean).join(' · ');$('nextPage').hidden=!state.nextPage;
    if(result.warning)showNotice(result.warning);else if(result.adjusted_channel)showNotice('La chaîne a été ouverte sur son onglet Vidéos.');
    renderEntries();
  }catch(error){state.entries=[];state.selected.clear();empty.innerHTML='<div><strong>Aucune vidéo affichée</strong>Vérifie le lien puis relance l’analyse.</div>';renderEntries();empty.classList.add('show');showNotice(error.message,true);}
  finally{analyzeBtn.disabled=false;analyzeBtn.textContent='Afficher les vidéos';}
}
analyzeBtn.addEventListener('click',()=>analyze());sourceUrl.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();analyze();}});
$('selectAll').addEventListener('click',()=>{state.selected=new Set(state.entries.filter(e=>!e.nested).map(e=>e.index));document.querySelectorAll('.card-check:not(:disabled)').forEach(e=>e.checked=true);updateSelection();});
$('selectNone').addEventListener('click',()=>{state.selected.clear();document.querySelectorAll('.card-check').forEach(e=>e.checked=false);updateSelection();});
$('nextPage').addEventListener('click',()=>{if(state.nextPage){sourceUrl.value=state.nextPage;analyze(state.nextPage);}});
$('folderBtn').addEventListener('click',async()=>{try{const result=await api('folder');if(result.folder){$('folder').value=result.folder;updateSelection();}}catch(error){showNotice(error.message,true);}});
$('mediaMode').addEventListener('change',()=>{$('quality').disabled=!$('mediaMode').value.startsWith('video_');});
$('downloadBtn').addEventListener('click',async()=>{
  if(!state.selected.size)return;try{await api('start',{url:state.effectiveUrl,folder:$('folder').value,mode:$('mediaMode').value,quality:$('quality').value,selection:'selected',indices:[...state.selected].sort((a,b)=>a-b),exclude_shorts:$('excludeShorts').checked});state.running=true;$('progressPanel').classList.add('show');$('downloadBtn').disabled=true;showNotice('');pollStatus();}catch(error){showNotice(error.message,true);}
});
$('cancelBtn').addEventListener('click',async()=>{try{await api('cancel');}catch(error){showNotice(error.message,true);}});
let pollTimer;
async function pollStatus(){
  clearTimeout(pollTimer);try{const response=await fetch('/api/status',{cache:'no-store'}),result=await response.json();state.running=!!result.running;$('statusText').textContent=result.status||'Prêt';$('progressText').textContent=result.progress||'';$('progressBar').style.width=result.progress||'0%';$('logs').textContent=(result.logs||[]).join('\n')||'En attente du journal…';$('logs').scrollTop=$('logs').scrollHeight;$('cancelBtn').hidden=!result.running;updateSelection();if(result.running)pollTimer=setTimeout(pollStatus,900);}catch(error){pollTimer=setTimeout(pollStatus,1800);}
}
</script>
</body>
</html>
